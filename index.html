<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pathfinder Kingmaker Map</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<div class="map-viewport" id="viewport">
    <div class="map-container" id="mapContainer">
        <img src="map.png" class="map-image" usemap="#hexMap" id="mapImg" alt="Map Grid">
        <div class="hex-visual-layer" id="visualLayer"></div>
        <map name="hexMap" id="clickableMap"></map>
    </div>
</div>

<div class="pop-menu" id="hexMenu">
	<img src="logo.png" class="menu-logo" alt="Pathfinder Logo">
    <h3 id="menuTitle">Hex Setup</h3>
    <div class="box">
        <label>Пометка (на карте):</label>
        <input type="text" id="inpTitle" maxlength="50">
    </div>
	
    <div class="box" style="display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="inpExplored" style="width: auto; cursor: pointer; transform: scale(1.3);">
            <label for="inpExplored" style="margin-bottom: 0; cursor: pointer; font-size: 16px;">Гекс разведан</label>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="inpMapMapped" style="width: auto; cursor: pointer; transform: scale(1.3);">
            <label for="inpMapMapped" style="margin-bottom: 0; cursor: pointer; font-size: 16px;">Карта составлена</label>
        </div>
    </div>
	
	<div class="box">
        <label>Тип объекта на гексе:</label>
        <select id="inpType" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 16px;">
            <option value="">-- Обычный гекс --</option>
            <option value="landmark">🔍 Достопримечательность</option>
            <option value="resource">🪵 Ресурс</option>
            <option value="quest">✔ Стандартное задание</option>
            <option value="mystery">❓ Тайна</option>
        </select>
    </div>
    <div class="box">
        <label>Тип местности (Навигация):</label>
        <select id="inpTerrain" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 16px;">
            <option value="">-- Не указана --</option>
            <option value="swamp">🐊 Болото (СЛ 14)</option>
            <option value="forest">🌲 Лес (СЛ 14)</option>
            <option value="water">🌊 Вода (СЛ 17)</option>
            <option value="arctic">❄ Приполярье (СЛ 17)</option>
            <option value="mountain">⛰ Горы (СЛ 16)</option>
            <option value="plains">🌾 Равнины (СЛ 12)</option>
        </select>
    </div>	
    <div class="box">
        <label>Описание гекса:</label>
        <textarea id="inpDesc" rows="4"></textarea>
    </div>

    <div class="box">
        <label>Сложность региона (СЛ):</label>
        <select id="inpDifficulty" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 16px;">
            <option value="">-- Выберите СЛ --</option>
        </select>
    </div>

    <div class="box">
        <label>Уровень региона (Монстры/Игроки):</label>
        <select id="inpRegionLevel" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 16px;">
            <option value="">-- Выберите уровень --</option>
        </select>
    </div>
	
    <div class="box">
        <label>Цвет гекса:</label>
        <div class="color-row">
            <input type="color" id="inpColor" value="#3498db">
            <button class="btn apply-btn" id="btnApplyColor">Применить цвет</button>
        </div>
    </div>
    <div class="buttons">
        <button class="btn del" id="btnDelete">Удалить</button>
        <div>
            <button class="btn cc" id="btnCancel">Отмена</button>
	</div>
	<div>
            <button class="btn ok" id="btnSave">Сохранить</button>
        </div>
    </div>
</div>

<div style="position: fixed; bottom: 20px; right: 20px; z-index: 10005; display: flex; gap: 10px;">
    <button class="btn ok" id="btnExport" style="background-color: #34495e; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">Export JSON</button>
    <button class="btn ok" id="btnImport" style="background-color: #9b59b6; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">Import JSON</button>
    <input type="file" id="fileInput" accept=".json" style="display: none;">
</div>

<div id="hexTooltip" class="hex-tooltip"></div>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Hex Map Advanced System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #222;
            font-family: sans-serif;
            color: #fff;
            overflow: hidden;
        }
        
        .map-viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .map-viewport:active {
            cursor: grabbing;
        }

        .map-container {
            position: absolute;
            top: 0; left: 0;
            width: 3840px;
            height: 1280px;
            user-select: none;
        }
        .map-image {
            display: block;
            width: 3840px;
            height: 1280px;
            pointer-events: auto;
        }
        .hex-visual-layer {
            position: absolute;
            top: 0; left: 0;
            width: 3840px;
            height: 1280px;
            pointer-events: none;
        }
        .visual-hex {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .hex-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transition: background 0.2s;
        }
        .visual-hex:hover .hex-shape {
            background: rgba(255, 255, 255, 0.5) !important;
        }
        .hex-text-label {
            position: relative;
            z-index: 2;
            color: #000;
            font-size: 30px;
            font-weight: bold;
            padding: 2px;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            
            width: 400px; 
            display: block;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
        }
        
        .pop-menu {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            color: #333;
            padding: 25px;
            border-radius: 8px;
            width: 360px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .pop-menu.open { display: block; }
        .box { margin-bottom: 15px; }
        .box label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .box input, .box textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .box input[type="color"] { width: 60px; height: 35px; cursor: pointer; }
        .color-row { display: flex; gap: 10px; align-items: center; }
        .buttons { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
        .btn { padding: 10px 20px; cursor: pointer; border: none; font-weight: bold; border-radius: 4px; }
        .ok { background: #2ecc71; color: white; }
        .cc { background: #95a5a6; color: white; }
        .del { background: #e74c3c; color: white; }
        .apply-btn { background: #3498db; color: white; padding: 8px 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="map-viewport" id="viewport">
    <div class="map-container" id="mapContainer">
        <img src="map.png" class="map-image" usemap="#hexMap" id="mapImg" alt="Map Grid">
        <div class="hex-visual-layer" id="visualLayer"></div>
        <map name="hexMap" id="clickableMap"></map>
    </div>
</div>

<div class="pop-menu" id="hexMenu">
    <h3 id="menuTitle">Hex Setup</h3>
    <div class="box">
        <label>Пометка (на карте):</label>
        <input type="text" id="inpTitle" maxlength="50">
    </div>
    <div class="box">
        <label>Описание гекса:</label>
        <textarea id="inpDesc" rows="4"></textarea>
    </div>

    <div class="box">
        <label>Сложность региона (Уровень):</label>
        <select id="inpDifficulty" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 16px;">
            <option value="">-- Выберите уровень --</option>
        </select>
    </div>

    <div class="box">
        <label>Цвет гекса:</label>
        <div class="color-row">
            <input type="color" id="inpColor" value="#3498db">
            <button class="btn apply-btn" id="btnApplyColor">Применить цвет</button>
        </div>
    </div>
    <div class="buttons">
        <button class="btn del" id="btnDelete">Удалить</button>
        <div>
            <button class="btn cc" id="btnCancel">Отмена</button>
	</div>
	<div>
            <button class="btn ok" id="btnSave">Сохранить</button>
        </div>
    </div>
</div>

<div style="position: fixed; bottom: 20px; right: 20px; z-index: 10005; display: flex; gap: 10px;">
    <button class="btn ok" id="btnExport" style="background-color: #34495e; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">Export JSON</button>
    <button class="btn ok" id="btnImport" style="background-color: #9b59b6; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">Import JSON</button>
    <input type="file" id="fileInput" accept=".json" style="display: none;">
</div>


<script>
    const hexRadius = 78;  
    const rows = 12;       
    const cols = 30;       
    const offsetX = 29; 
    const offsetY = 16; 

    const clickableMap = document.getElementById('clickableMap');
    const visualLayer = document.getElementById('visualLayer');
    const modal = document.getElementById('hexMenu');
    const difficultySelect = document.getElementById('inpDifficulty');
    let currentHexId = null;
    
    let mapData = JSON.parse(localStorage.getItem('hexMapSystemData')) || {};

    function populateDifficultySelect() {
        for (let i = 1; i <= 40; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = 'Level ' + i;
            difficultySelect.appendChild(opt);
        }
    }

    function getHexCoordsArray(cx, cy, r) {
        let coords = [];
        for (let i = 0; i < 6; i++) {
            let angle_deg = 60 * i - 30;
            let angle_rad = Math.PI / 180 * angle_deg;
            let x = Math.round(cx + r * Math.cos(angle_rad));
            let y = Math.round(cy + r * Math.sin(angle_rad));
            coords.push(x, y);
        }
        return coords.join(',');
    }

    function buildHexGrid() {
        clickableMap.innerHTML = '';
        visualLayer.innerHTML = '';

        const widthBetweenHexes = hexRadius * Math.sqrt(3);
        const heightBetweenHexes = hexRadius * 1.5;
        const hexWidth = hexRadius * Math.sqrt(3);
        const hexHeight = hexRadius * 2;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let cx = offsetX + c * widthBetweenHexes;
                let cy = offsetY + r * heightBetweenHexes;

                if (r % 2 !== 0) { cx += widthBetweenHexes / 2; }

                const hexId = 'hex_' + r + '_' + c;

                const area = document.createElement('area');
                area.setAttribute('shape', 'poly');
                area.setAttribute('coords', getHexCoordsArray(cx, cy, hexRadius));
                area.setAttribute('href', '#');
                area.setAttribute('id', 'area_' + hexId);
                
                area.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (hasMoved) return; 
                    
                    if (modal.classList.contains('open')) {
                        closeMenu();
                    } else {
                        openMenu(hexId);
                    }
                });
                clickableMap.appendChild(area);

                const vHex = document.createElement('div');
                vHex.className = 'visual-hex';
                vHex.style.width = hexWidth + 'px';
                vHex.style.height = hexHeight + 'px';
                vHex.style.left = (cx - hexWidth / 2) + 'px';
                vHex.style.top = (cy - hexRadius) + 'px';
                vHex.setAttribute('id', 'visual_' + hexId);

                const shape = document.createElement('div');
                shape.className = 'hex-shape';
                shape.setAttribute('id', 'shape_' + hexId);
                
                if (mapData[hexId] && mapData[hexId].color) {
                    shape.style.backgroundColor = convertHexToRgba(mapData[hexId].color, 0.4);
                }
                vHex.appendChild(shape);

                const label = document.createElement('span');
                label.className = 'hex-text-label';
                label.setAttribute('id', 'label_' + hexId);
                
                if (mapData[hexId] && mapData[hexId].title) {
                    const title = mapData[hexId].title;
                    const diff = mapData[hexId].difficulty;
                    if (diff) {
                        label.textContent = title + ': lvl ' + diff;
                    } else {
                        label.textContent = title;
                    }
                }
                vHex.appendChild(label);

                visualLayer.appendChild(vHex);
            }
        }
    }

    function convertHexToRgba(hex, alpha) {
        let r = parseInt(hex.slice(1, 3), 16);
        let g = parseInt(hex.slice(3, 5), 16);
        let b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function openMenu(hexId) {
        currentHexId = hexId;
        document.getElementById('menuTitle').textContent = 'Hex Setup: ' + hexId;
        
        if (mapData[hexId]) {
            document.getElementById('inpTitle').value = mapData[hexId].title || '';
            document.getElementById('inpDesc').value = mapData[hexId].text || '';
            document.getElementById('inpColor').value = mapData[hexId].color || '#3498db';
            difficultySelect.value = mapData[hexId].difficulty || ''; 
        } else {
            document.getElementById('inpTitle').value = '';
            document.getElementById('inpDesc').value = '';
            document.getElementById('inpColor').value = '#3498db';
            difficultySelect.value = ''; 
        }
        modal.classList.add('open');
    }
    function closeMenu() {
        modal.classList.remove('open');
        currentHexId = null;
    }

    function saveMenu() {
        if (!currentHexId) return;
        const titleVal = document.getElementById('inpTitle').value;
        const descVal = document.getElementById('inpDesc').value;
        const colorVal = document.getElementById('inpColor').value;
        const diffVal = difficultySelect.value; 

        mapData[currentHexId] = { 
            title: titleVal, 
            text: descVal, 
            color: colorVal,
            difficulty: diffVal 
        };
        localStorage.setItem('hexMapSystemData', JSON.stringify(mapData));

        const shape = document.getElementById('shape_' + currentHexId);
        const label = document.getElementById('label_' + currentHexId);

        if (shape) shape.style.backgroundColor = convertHexToRgba(colorVal, 0.4);
        
        if (label) {
            if (diffVal) {
                label.textContent = titleVal + ': lvl ' + diffVal;
            } else {
                label.textContent = titleVal;
            }
        }

        closeMenu();
    }

    document.getElementById('btnApplyColor').addEventListener('click', function() {
        if (!currentHexId) return;
        const colorVal = document.getElementById('inpColor').value;
        const shape = document.getElementById('shape_' + currentHexId);
        if (shape) {
            shape.style.backgroundColor = convertHexToRgba(colorVal, 0.4);
        }
    });

    document.getElementById('btnDelete').addEventListener('click', function() {
        if (!currentHexId) return;
        
        delete mapData[currentHexId];
        localStorage.setItem('hexMapSystemData', JSON.stringify(mapData));

        const shape = document.getElementById('shape_' + currentHexId);
        const label = document.getElementById('label_' + currentHexId);
        
        if (shape) shape.style.backgroundColor = 'rgba(255, 255, 255, 0)';
        if (label) label.textContent = '';

        closeMenu();
    });

    const viewport = document.getElementById('viewport');
    const mapContainer = document.getElementById('mapContainer');
    let isDragging = false;
    let hasMoved = false; 
    let startX, startY;

    viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.pop-menu') || e.target.closest('button')) return;
        isDragging = true;
        hasMoved = false;
        startX = e.pageX - mapContainer.offsetLeft;
        startY = e.pageY - mapContainer.offsetTop;
    });

    viewport.addEventListener('mouseleave', () => { isDragging = false; });
    viewport.addEventListener('mouseup', () => {
        isDragging = false;
        setTimeout(() => { hasMoved = false; }, 50);
    });

    viewport.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - startX;
        const y = e.pageY - startY;
        
        if (Math.abs(x - mapContainer.offsetLeft) > 3 || Math.abs(y - mapContainer.offsetTop) > 3) {
            hasMoved = true;
        }
        mapContainer.style.left = x + 'px';
        mapContainer.style.top = y + 'px';
    });

    // ЭКСПОРТ JSON
    document.getElementById('btnExport').addEventListener('click', function() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapData, null, 4));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "map_data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    // ИМПОРТ JSON
    const fileInput = document.getElementById('fileInput');
    document.getElementById('btnImport').addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file || file.length === 0) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                mapData = JSON.parse(evt.target.result);
                localStorage.setItem('hexMapSystemData', JSON.stringify(mapData));
                buildHexGrid();
                alert('Data successfully imported!');
            } catch (err) {
                alert('Error parsing JSON file.');
            }
        };
        reader.readAsText(file);
    });

    modal.addEventListener('click', function(e) {
        if (e.target === modal) { closeMenu(); }
    });

    document.getElementById('mapImg').addEventListener('click', function() {
        if (!hasMoved) closeMenu();
    });

    document.getElementById('btnCancel').addEventListener('click', closeMenu);
    document.getElementById('btnSave').addEventListener('click', saveMenu);

    populateDifficultySelect();
    buildHexGrid();
</script>
</body>
</html>
